{% extends "base.html" %}
{% block title %}Cadastrar Imóvel - Sistema RENT{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Cadastrar Novo Imóvel</h2>

    <form method="POST" action="{{ url_for('adicionar_imovel') }}" class="shadow-sm p-4 bg-light rounded">
        <div class="mb-3">
            <label for="tipo" class="form-label">Tipo</label>
            <input type="text" class="form-control" id="tipo" name="tipo" placeholder="Casa, Apartamento..." required>
        </div>

        <div class="mb-3">
            <label for="endereco" class="form-label">Endereço</label>
            <input type="text" class="form-control" id="endereco" name="endereco" required>
        </div>

        <div class="mb-3">
            <label for="valor" class="form-label">Valor</label>
            <input type="number" step="0.01" class="form-control" id="valor" name="valor" required>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status" name="status">
                <option value="disponivel">Disponível</option>
                <option value="vendido">Vendido</option>
                <option value="alugado">Alugado</option>
                <option value="reservado">Reservado</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="corretor_id" class="form-label">Corretor Responsável</label>
            <select class="form-select" id="corretor_id" name="corretor_id">
                <option value="">-- Selecionar --</option>
                {% for corretor in corretores %}
                <option value="{{ corretor.id }}">{{ corretor.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="descricao" class="form-label">Descrição</label>
            <textarea class="form-control" id="descricao" name="descricao" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="{{ url_for('listar_imoveis') }}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
{% endblock %}
