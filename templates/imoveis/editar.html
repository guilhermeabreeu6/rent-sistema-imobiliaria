{% extends "base.html" %}
{% block title %}Editar Imóvel - Sistema RENT{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Editar Imóvel</h2>

    <form method="POST" action="{{ url_for('editar_imovel', imovel_id=imovel.id) }}" class="shadow-sm p-4 bg-light rounded">
        <div class="mb-3">
            <label for="tipo" class="form-label">Tipo</label>
            <input type="text" class="form-control" id="tipo" name="tipo" value="{{ imovel.tipo }}" required>
        </div>

        <div class="mb-3">
            <label for="endereco" class="form-label">Endereço</label>
            <input type="text" class="form-control" id="endereco" name="endereco" value="{{ imovel.endereco }}" required>
        </div>

        <div class="mb-3">
            <label for="valor" class="form-label">Valor</label>
            <input type="number" step="0.01" class="form-control" id="valor" name="valor" value="{{ imovel.valor }}" required>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status" name="status">
                <option value="disponivel" {% if imovel.status == 'disponivel' %}selected{% endif %}>Disponível</option>
                <option value="vendido" {% if imovel.status == 'vendido' %}selected{% endif %}>Vendido</option>
                <option value="alugado" {% if imovel.status == 'alugado' %}selected{% endif %}>Alugado</option>
                <option value="reservado" {% if imovel.status == 'reservado' %}selected{% endif %}>Reservado</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="corretor_id" class="form-label">Corretor Responsável</label>
            <select class="form-select" id="corretor_id" name="corretor_id">
                <option value="">-- Selecionar --</option>
                {% for corretor in corretores %}
                <option value="{{ corretor.id }}" {% if imovel.corretor_id == corretor.id %}selected{% endif %}>{{ corretor.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="descricao" class="form-label">Descrição</label>
            <textarea class="form-control" id="descricao" name="descricao" rows="3">{{ imovel.descricao }}</textarea>
        </div>

        <button type="submit" class="btn btn-success">Salvar alterações</button>
        <a href="{{ url_for('visualizar_imovel', imovel_id=imovel.id) }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
