{% extends "base.html" %}
{% block title %}Editar Corretor - Sistema RENT{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Editar Corretor</h2>

    <form method="POST" action="{{ url_for('editar_corretor', corretor_id=corretor.id) }}" class="shadow-sm p-4 bg-light rounded">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" name="nome" value="{{ corretor.nome }}" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ corretor.email }}" required>
        </div>

        <div class="mb-3">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="text" class="form-control" id="telefone" name="telefone" value="{{ corretor.telefone }}">
        </div>

        <div class="mb-3">
            <label for="creci" class="form-label">CRECI</label>
            <input type="text" class="form-control" id="creci" name="creci" value="{{ corretor.creci }}">
        </div>

        <button type="submit" class="btn btn-success">Salvar alterações</button>
        <a href="{{ url_for('visualizar_corretor', corretor_id=corretor.id) }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
